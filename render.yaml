# ─────────────────────────────────────────────────────────────────
# AutoHeal AI — Render Infrastructure as Code (Blueprint)
# https://render.com/docs/blueprint-spec
# ─────────────────────────────────────────────────────────────────
version: "1"

databases:
  - name: autoheal-postgres
    databaseName: autoheal
    user: autoheal
    plan: starter
    ipAllowList: [] # internal access only

services:
  # ── 1. Redis Distributed Cache & Dedup Lock ───────────────────
  - type: redis
    name: autoheal-redis
    plan: starter
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru

  # ── 2. FastAPI Core Web API Service ───────────────────────────
  - type: web
    name: autoheal-api
    runtime: python
    plan: starter
    region: oregon
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 4"
    healthCheckPath: "/health"
    autoDeploy: true
    envVars:
      - key: APP_NAME
        value: auto-heal-ai
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: LOG_LEVEL
        value: INFO

      # Managed Database & Redis links
      - key: DATABASE_URL
        fromDatabase:
          name: autoheal-postgres
          property: connectionString
      - key: REDIS_URL
        fromRedis:
          name: autoheal-redis
          property: connectionString

      # Sentry Webhook Integration Secret
      - key: SENTRY_CLIENT_SECRET
        sync: false

      # GitHub App Production Authentication
      - key: GITHUB_APP_ID
        sync: false
      - key: GITHUB_PRIVATE_KEY
        sync: false
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
      - key: GITHUB_OWNER
        sync: false
      - key: GITHUB_REPO
        sync: false
      - key: GITHUB_DEFAULT_BRANCH
        value: main

      # LLM Orchestrator
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        value: gpt-4o
      - key: LLM_BASE_URL
        value: https://api.openai.com/v1

      # CORS for Vercel Frontend
      - key: CORS_ORIGINS
        value: '["https://autoheal.vercel.app","http://localhost:3000"]'

  # ── 3. Background Autonomous Incident Worker ──────────────────
  - type: worker
    name: autoheal-worker
    runtime: python
    plan: starter
    region: oregon
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python -m app.workers.incident_worker"
    autoDeploy: true
    envVars:
      - key: APP_NAME
        value: auto-heal-worker
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO

      # Database & Redis bindings
      - key: DATABASE_URL
        fromDatabase:
          name: autoheal-postgres
          property: connectionString
      - key: REDIS_URL
        fromRedis:
          name: autoheal-redis
          property: connectionString

      # GitHub App Credentials
      - key: GITHUB_APP_ID
        sync: false
      - key: GITHUB_PRIVATE_KEY
        sync: false
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
      - key: GITHUB_OWNER
        sync: false
      - key: GITHUB_REPO
        sync: false
      - key: GITHUB_DEFAULT_BRANCH
        value: main

      # LLM Orchestrator
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        value: gpt-4o
      - key: LLM_BASE_URL
        value: https://api.openai.com/v1

      # Optional Notification Channels
      - key: SLACK_WEBHOOK_URL
        sync: false
      - key: DISCORD_WEBHOOK_URL
        sync: false
