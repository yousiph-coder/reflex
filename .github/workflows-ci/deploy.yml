name: CI / CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 1. Backend Verification (Tests & Schema Validation) ───────
  backend-test:
    name: Backend Tests (FastAPI & Services)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: autoheal
          POSTGRES_PASSWORD: changeme
          POSTGRES_DB: autoheal
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run Test Suite
        env:
          APP_ENV: development
          DEBUG: "true"
          DATABASE_URL: postgresql+asyncpg://autoheal:changeme@localhost:5432/autoheal
          REDIS_URL: redis://localhost:6379/0
          SENTRY_CLIENT_SECRET: mock-sentry-secret
          GITHUB_TOKEN: gho_mock_test_token
          GITHUB_OWNER: yousiph-coder
          GITHUB_REPO: autoheal-target-demo
          GITHUB_DEFAULT_BRANCH: main
          LLM_API_KEY: sk-mock-test-key
          LLM_MODEL: gpt-4o
        run: |
          python -m pytest tests/ -v

  # ── 2. Frontend Verification (Next.js Build & Type Check) ─────
  frontend-build:
    name: Frontend Build & Type Check
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build Next.js Dashboard
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://autoheal-api.onrender.com/api/v1
